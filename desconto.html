<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <script src="javascript3.js" defer></script>
        <style>
            h2 {
                color: white;
            }

            .cabecalho {
                display: flex;
                align-items: center;
                padding: 10px;
                background-color: blue;
                box-shadow: 2px 10px rgba(0,0,0, 0.1);
                position: sticky;
                top: 0;
                z-index: 1000;
            }
        </style>
    </head>
<body>
    <header class="cabecalho">
        <h2>Produto e Desconto</h2>
    </header>
    <br>
    
    <!-- Textarea usada para exibir o resultado -->
    <textarea id="mensagem" name="mensagem" rows="4" cols="40" placeholder="O resultado aparecerá aqui..."></textarea>
    <br><br>

    <label for="preco">Preço do produto:</label>
    <input type="number" id="preco" name="preco" placeholder="Digite seu preço">

    <h3>Escolha a porcentagem do desconto</h3>
    <div class="botoes">
        <!-- Adicionamos value="0.10", value="0.20", etc. -->
        <input type="radio" id="desconto10" name="desconto" value="0.10">
        <label for="desconto10">10%</label>

        <input type="radio" id="desconto20" name="desconto" value="0.20">
        <label for="desconto20">20%</label>

        <input type="radio" id="desconto50" name="desconto" value="0.50">
        <label for="desconto50">50%</label>
    </div>
    <br>

    <button id="botao">Confirmar</button>

</body>
</html>
